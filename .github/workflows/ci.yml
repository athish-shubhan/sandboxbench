name: ci
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go mod tidy
        run: go mod tidy -diff
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...
      # The runtime benchmarks need root, runc and runsc; the pool simulation
      # does not, and must reproduce the committed results exactly.
      - name: warm-pool simulation reproduces results/pool.jsonl
        run: |
          go run ./cmd/poolsim -coldstart results/coldstart.json -out /tmp/pool.jsonl > /dev/null
          cmp results/pool.jsonl /tmp/pool.jsonl

  # Drives real runc through the harness (no gVisor on CI runners: the runsc
  # arm is runc via bench/runc-as-runsc.sh). Checks the bundle, the CLI
  # driver and the results file end to end, not the README's numbers.
  harness-runc:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: cold start with runc, 3 reps
        run: |
          go build -o bin/sandboxbench ./cmd/sandboxbench
          mkdir -p corpus
          sudo bench/rootfs.sh
          sudo RUNC="$(command -v runc)" bin/sandboxbench coldstart -runc "$(command -v runc)" \
            -runsc "$PWD/bench/runc-as-runsc.sh" -reps 3 -out /tmp/sb
          jq -e '.result.summary.runc.claim_to_first_exec_ms.n == 3' /tmp/sb/coldstart.json

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
