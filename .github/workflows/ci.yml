name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...
      # The runtime benchmarks need root, runc and runsc; the pool simulation
      # does not, and must reproduce the committed results exactly.
      - name: warm-pool simulation reproduces results/pool.jsonl
        run: |
          go run ./cmd/poolsim -coldstart results/coldstart.json -out /tmp/pool.jsonl > /dev/null
          cmp results/pool.jsonl /tmp/pool.jsonl

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
